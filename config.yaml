# config.yaml - Smart Reception Assistant Configuration
# ============================================================
# This file controls ALL tunable parameters of the system.
# Edit this file to change behavior without modifying code.
# Restart the server after making changes.
# ============================================================

# --- Server Settings ---
server:
  host: "0.0.0.0"
  port: 5000
  debug: false
  workers: 1

# --- Edge Device Settings ---
edge:
  expected_ip: "192.168.1.100"
  heartbeat_interval: 10
  frame_timeout: 30
  live_feed_fps: 12   # throttle dashboard video preview (0 = no throttle)

# --- Camera Settings ---
camera:
  device_id: 0
  resolution_width: 1920
  resolution_height: 1080
  fps: 30
  jpeg_quality: 80
  backend: "v4l2"

# --- PIR Sensor Settings --- (REMOVED)
# The PIR motion sensor module has been removed. The camera runs always-on at
# the full camera.fps (30) with no motion gating and no idle downtime.
# pir:
#   gpio_pin: 17
#   debounce_ms: 2000
#   idle_timeout_s: 60
#   always_on: false

# --- Person Detection Settings ---
detection:
  model: "yolov8n"
  confidence_threshold: 0.5
  nms_iou_threshold: 0.4
  device: "auto"          # auto -> CUDA (GPU) if available, else CPU
  inference_width: 960    # YOLO imgsz; lower = faster / lower latency

# --- Face Recognition Settings ---
recognition:
  detection_model: "mtcnn"
  recognition_model: "facenet"
  similarity_threshold: 0.80
  max_embeddings_per_guest: 5
  re_recognition_interval: 30
  recognize_every_n_frames: 15   # run FaceNet every Nth frame (balanced)
  inference_width: 960           # downscale width for MTCNN face detection

# --- Lobby Monitoring Settings ---
monitoring:
  security_dwell_threshold: 600
  assistance_dwell_threshold: 300
  # Time (seconds) after a track's last detection before person_monitor
  # evicts it. Lower = "Lobby at a glance" reflects current occupancy
  # quickly; higher = more tolerant of brief detection drops.
  tracking_timeout: 8

# --- Alert Settings ---
alerts:
  cooldown_period: 900
  email_enabled: true
  sms_enabled: false
  dashboard_sound_enabled: true

# --- Database Settings ---
database:
  path: "data/smart_reception.db"
  backup_enabled: true
  backup_interval: "daily"
  backup_time: "02:00"
  backup_retention_days: 7

# --- Security Settings ---
security:
  session_timeout: 28800
  inactivity_timeout: 1800
  max_login_attempts: 5
  lockout_duration: 900